<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10162f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Тренировки">
  <meta name="description" content="Личный дневник тренировок, посещений, расходов и веса тела. Данные только на устройстве.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Тренировки</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div class="brand-name"><strong>Тренировки</strong><span>Личный дневник</span></div>
      <div class="header-spacer"></div>
      <label class="sr-only" for="profile-select">Участник</label>
      <select id="profile-select" class="profile-select" aria-label="Выбрать участника"></select>
      <button id="add-profile" class="icon-btn" aria-label="Добавить участника" title="Добавить участника">+</button>
    </header>

    <main id="content" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Разделы приложения">
      <button class="tab active" data-tab="home"><span class="tab-ico">⌂</span><span>Главная</span></button>
      <button class="tab" data-tab="schedule"><span class="tab-ico">▦</span><span>График</span></button>
      <button class="tab" data-tab="diary"><span class="tab-ico">▤</span><span>Дневник</span></button>
      <button class="tab" data-tab="money"><span class="tab-ico">₽</span><span>Расходы</span></button>
      <button class="tab" data-tab="weight"><span class="tab-ico">⌁</span><span>Вес</span></button>
      <button class="tab" data-tab="settings"><span class="tab-ico">⚙</span><span>Настройки</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script defer src="./app.js"></script>
</body>
</html>
